<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GFERRO Intranet • Soluções em Telhas</title>
  <script>
    (function () {
      try {
        var currentFetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function () {
            return currentFetch;
          },
          set: function (fn) {
            currentFetch = fn;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        console.warn('Fetch property safeguard script warning:', e);
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
